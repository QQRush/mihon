name: Publish Smart Scroll Release
on:
  workflow_dispatch:
  push:
    branches: [feature/smart-scroll]
    paths:
      - '.github/workflows/publish-smart-scroll-release.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified production build
        uses: actions/download-artifact@v4
        with:
          name: mihon-smart-scroll-v0.78-production-arm64-signed
          run-id: 39939360577
          github-token: ${{ github.token }}
          path: release-apk
      - name: Check APK and prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find release-apk -type f -name '*.apk' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, got ${#apks[@]}"
            exit 1
          fi
          mkdir -p dist
          cp "${apks[0]}" dist/Mihon-Smart-Scroll-v0.78-arm64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.78-smart-scroll dist/Mihon-Smart-Scroll-v0.78-arm64.apk dist/SHA256SUMS.txt \
            --target e80fe71680c4d5818c37ee5e722c1eedaead4313 \
            --title "Mihon Smart Scroll v0.78 — Production" \
            --notes "First optimized ARM64 production build of the unofficial Mihon Smart Scroll fork.

          Features: intelligent one-tap webtoon scrolling, conservative speech-balloon and panel preservation, Smart Fit, 100% viewport fallback and backward checkpoints.

          The visual debug overlay and its settings switch are hidden in this build. Smart Scroll and Smart Fit image-analysis logic remain enabled.

          Android ARM64 only. Package: app.mihon.dev. Signed with the fork's existing signing key. Back up your data before upgrading.

          This is an unofficial Mihon fork and includes no content or extensions. See the repository README for setup and known limitations."
