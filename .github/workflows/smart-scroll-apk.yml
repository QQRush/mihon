name: Smart Scroll APK
on:
  workflow_dispatch:
  push:
    branches: [feature/smart-scroll]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Smart Scroll v0.1
        run: python3 scripts/apply_smart_scroll_v01.py
      - name: Apply visual debug v0.2
        run: python3 scripts/apply_smart_scroll_debug_v02.py
      - name: Apply separator probe v0.3
        run: python3 scripts/apply_smart_scroll_probe_v03.py
      - name: Apply gutter safety filter v0.4
        run: python3 scripts/apply_smart_scroll_probe_v04.py
      - name: Apply Smart Scroll v0.5
        run: python3 scripts/apply_smart_scroll_v05.py
      - name: Require persistent signing key
        env:
          SMART_SCROLL_KEYSTORE_B64: ${{ secrets.SMART_SCROLL_KEYSTORE_B64 }}
          SMART_SCROLL_STORE_PASSWORD: ${{ secrets.SMART_SCROLL_STORE_PASSWORD }}
          SMART_SCROLL_KEY_ALIAS: ${{ secrets.SMART_SCROLL_KEY_ALIAS }}
          SMART_SCROLL_KEY_PASSWORD: ${{ secrets.SMART_SCROLL_KEY_PASSWORD }}
        run: |
          test -n "$SMART_SCROLL_KEYSTORE_B64" || { echo "Missing persistent keystore: cannot guarantee in-place upgrade"; exit 1; }
          test -n "$SMART_SCROLL_STORE_PASSWORD" && test -n "$SMART_SCROLL_KEY_ALIAS" && test -n "$SMART_SCROLL_KEY_PASSWORD" || exit 1
          echo "$SMART_SCROLL_KEYSTORE_B64" | base64 -d > app/smart-scroll-signing.jks
          printf 'storeFile=smart-scroll-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SMART_SCROLL_STORE_PASSWORD" "$SMART_SCROLL_KEY_ALIAS" "$SMART_SCROLL_KEY_PASSWORD" > keystore.properties
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mihon-smart-scroll-v0.5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
