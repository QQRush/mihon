name: Smart Scroll APK
on:
  workflow_dispatch:
  push:
    branches: [feature/smart-scroll]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      # GitHub Ubuntu runners include Android SDK; avoid sdkmanager bootstrap failure.
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Smart Scroll v0.1
        run: python3 scripts/apply_smart_scroll_v01.py
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mihon-smart-scroll-v0.1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
