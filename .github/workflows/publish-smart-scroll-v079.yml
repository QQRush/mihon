name: Publish Smart Scroll v0.79 Release
on:
  workflow_run:
    workflows: ["Smart Scroll Production APK"]
    types: [completed]
    branches: [feature/smart-scroll]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == '8a8130d566ec3b61d8cd0ba240193f7ec480ca9f' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mihon-smart-scroll-v0.79-production-arm64-signed
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-apk
      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find release-apk -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1
          mkdir -p dist
          cp "${apks[0]}" dist/Mihon-Smart-Scroll-v0.79-arm64.apk
          (cd dist && sha256sum Mihon-Smart-Scroll-v0.79-arm64.apk > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.79-smart-scroll dist/Mihon-Smart-Scroll-v0.79-arm64.apk dist/SHA256SUMS.txt \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Mihon Smart Scroll v0.79 — Production" \
            --notes "Production maintenance update: removes the remaining Visual Debug checkbox from the in-reader Reading mode menu. Diagnostic overlay and general debug settings are already hidden. Smart Scroll, Smart Fit, content protection and backward navigation are unchanged from v0.78. Signed optimized ARM64 APK; package app.mihon.dev. Back up your data before updating. Unofficial Mihon fork."
